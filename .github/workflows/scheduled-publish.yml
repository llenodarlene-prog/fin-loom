name: Scheduled publish
# Once a day, check whether an approved post on main reaches its publication date. If one does, rebuild
# and deploy production so it appears. The deploy waits for the production environment's approval.
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: main}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .nvmrc}
      - id: check
        run: node scripts/schedule.mjs due
  deploy:
    needs: due
    if: needs.due.outputs.due == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
